  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

,-50%);z-index:3;width:20px;height:20px;border-radius:50%;background:#FBF9F5;border:1.5px solid {{accent}};display:flex;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 1px 2px rgba(40,34,26,.14);\">\n                    <svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{accent}}\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9h13\"><\u002Fpath><path d=\"M14 5l4 4-4 4\"><\u002Fpath><path d=\"M20 15H7\"><\u002Fpath><path d=\"M10 19l-4-4 4-4\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <!-- legend -->\n          <div style=\"display:flex;align-items:center;flex-wrap:wrap;gap:9px 14px;padding:13px 16px;\">\n            <div style=\"display:flex;align-items:center;gap:6px;\"><span style=\"width:10px;height:10px;border-radius:3px;background:#4E8A6B;\"><\u002Fspan><span style=\"font-size:11px;color:#8A847A;\">Confirmada<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;\"><span style=\"width:10px;height:10px;border-radius:3px;background:#C2933F;\"><\u002Fspan><span style=\"font-size:11px;color:#8A847A;\">Parcial<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;\"><span style=\"width:10px;height:10px;border-radius:3px;background:#BC7559;\"><\u002Fspan><span style=\"font-size:11px;color:#8A847A;\">Pendente<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:6px;\"><span style=\"width:18px;height:18px;border-radius:50%;background:#FBF9F5;border:1.5px solid {{accent}};display:flex;align-items:center;justify-content:center;\"><svg width=\"10\" height=\"10\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{accent}}\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9h13\"><\u002Fpath><path d=\"M14 5l4 4-4 4\"><\u002Fpath><path d=\"M20 15H7\"><\u002Fpath><path d=\"M10 19l-4-4 4-4\"><\u002Fpath><\u002Fsvg><\u002Fspan><span style=\"font-size:11px;color:#8A847A;\">Vira-quarto (saída + entrada)<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height:90px;\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- AGENDA -->\n      <sc-if value=\"{{isAgenda}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"padding:4px 0 110px;\">\n          <sc-for list=\"{{agendaDays}}\" as=\"d\" hint-placeholder-count=\"7\">\n            <div>\n              <div style=\"position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:9px;padding:13px 16px 9px;background:#FBF9F5;\">\n                <div style=\"font-family:'Marcellus',serif;font-size:20px;color:#211E1A;line-height:1;min-width:24px;\">{{d.dayNum}}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;line-height:1.15;\">\n                  <span style=\"font-size:13px;font-weight:700;color:#3A352D;\">{{d.weekdayLong}}<\u002Fspan>\n                  <span style=\"font-size:10px;color:#AEA89C;\">{{d.monthShort}}<\u002Fspan>\n                <\u002Fdiv>\n                <sc-if value=\"{{d.isToday}}\" hint-placeholder-val=\"{{false}}\">\n                  <span style=\"font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:{{accent}};padding:3px 8px;border-radius:20px;\">Hoje<\u002Fspan>\n                <\u002Fsc-if>\n                <span style=\"margin-left:auto;font-size:11px;color:#AEA89C;\">{{d.occLabel}}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"padding:0 16px;\">\n                <sc-for list=\"{{d.arrivals}}\" as=\"c\" hint-placeholder-count=\"0\">\n                  <div onclick=\"{{c.open}}\" style=\"display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #EFEAE1;border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(40,34,26,.03);\">\n                    <div style=\"flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;width:54px;\">\n                      <span style=\"font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:{{c.kindColor}};background:{{c.kindBg}};padding:3px 7px;border-radius:8px;\">{{c.kind}}<\u002Fspan>\n                      <span style=\"font-size:11px;font-weight:600;color:#7A746A;\">{{c.timeLabel}}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"flex:1 1 auto;min-width:0;\">\n                      <div style=\"font-size:14px;font-weight:700;color:#211E1A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{c.guest}}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#8A847A;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{c.room}} · {{c.dateRange}}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;\">\n                      <span style=\"font-size:9px;font-weight:600;color:{{c.statusColor}};background:{{c.statusBg}};padding:3px 7px;border-radius:8px;\">{{c.statusLabel}}<\u002Fspan>\n                      <span style=\"font-size:11px;color:#AEA89C;\">{{c.nightsLabel}}<\u002Fspan>\n                      <sc-if value=\"{{c.turnover}}\" hint-placeholder-val=\"{{false}}\">\n                        <span style=\"display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:{{accent}};background:#EEF3F0;padding:3px 7px;border-radius:8px;white-space:nowrap;\">⇄ Vira-quarto<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-for list=\"{{d.departures}}\" as=\"c\" hint-placeholder-count=\"0\">\n                  <div onclick=\"{{c.open}}\" style=\"display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #EFEAE1;border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(40,34,26,.03);\">\n                    <div style=\"flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:4px;width:54px;\">\n                      <span style=\"font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:{{c.kindColor}};background:{{c.kindBg}};padding:3px 7px;border-radius:8px;\">{{c.kind}}<\u002Fspan>\n                      <span style=\"font-size:11px;font-weight:600;color:#7A746A;\">{{c.timeLabel}}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"flex:1 1 auto;min-width:0;\">\n                      <div style=\"font-size:14px;font-weight:700;color:#211E1A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{c.guest}}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#8A847A;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">{{c.room}} · {{c.dateRange}}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px;\">\n                      <span style=\"font-size:9px;font-weight:600;color:{{c.statusColor}};background:{{c.statusBg}};padding:3px 7px;border-radius:8px;\">{{c.statusLabel}}<\u002Fspan>\n                      <span style=\"font-size:11px;color:#AEA89C;\">{{c.nightsLabel}}<\u002Fspan>\n                      <sc-if value=\"{{c.turnover}}\" hint-placeholder-val=\"{{false}}\">\n                        <span style=\"display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:{{accent}};background:#EEF3F0;padding:3px 7px;border-radius:8px;white-space:nowrap;\">⇄ Vira-quarto<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{d.empty}}\" hint-placeholder-val=\"{{false}}\">\n                  <div style=\"font-size:12px;color:#BCB5A8;padding:4px 2px 14px;\">Sem chegadas ou saídas<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n\n    <!-- FAB -->\n    <button onclick=\"{{newReservation}}\" style=\"position:absolute;right:18px;bottom:18px;z-index:8;width:54px;height:54px;border-radius:50%;border:none;background:{{accent}};color:#fff;font-size:27px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 20px rgba(40,34,26,.28);cursor:pointer;\">+<\u002Fbutton>\n\n    <!-- BOTTOM SHEET -->\n    <sc-if value=\"{{selected}}\" hint-placeholder-val=\"{{false}}\">\n      <div onclick=\"{{closeSheet}}\" style=\"position:absolute;inset:0;z-index:20;background:rgba(28,24,20,.44);display:flex;flex-direction:column;justify-content:flex-end;\">\n        <div onclick=\"{{stop}}\" style=\"background:#fff;border-radius:24px 24px 0 0;padding:8px 20px 26px;box-shadow:0 -12px 44px rgba(28,24,20,.22);\">\n          <div style=\"width:40px;height:4px;border-radius:4px;background:#E3DDD2;margin:6px auto 17px;\"><\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px;\">\n            <div style=\"min-width:0;\">\n              <div style=\"font-family:'Marcellus',serif;font-size:24px;color:#211E1A;line-height:1.1;\">{{selected.guest}}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#8A847A;margin-top:4px;\">{{selected.room}} · {{selected.type}}<\u002Fdiv>\n            <\u002Fdiv>\n            <span style=\"flex:0 0 auto;font-size:10px;font-weight:700;color:{{selected.statusColor}};background:{{selected.statusBg}};padding:5px 11px;border-radius:20px;white-space:nowrap;\">{{selected.statusLabel}}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;align-items:stretch;gap:10px;margin-top:18px;\">\n            <div style=\"flex:1;background:#FAF8F4;border:1px solid #EFEAE1;border-radius:14px;padding:12px;\">\n              <div style=\"font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:#AEA89C;font-weight:700;\">Check-in<\u002Fdiv>\n              <div style=\"font-size:14px;font-weight:700;color:#211E1A;margin-top:6px;\">{{selected.checkInDate}}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#8A847A;margin-top:2px;\">{{selected.checkInTime}}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 2px;\">\n              <div style=\"font-size:11px;font-weight:700;color:#6F6A61;white-space:nowrap;\">{{selected.nightsLabel}}<\u002Fdiv>\n              <div style=\"font-size:17px;line-height:1;color:#C7BFB1;\">→<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;background:#FAF8F4;border:1px solid #EFEAE1;border-radius:14px;padding:12px;\">\n              <div style=\"font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:#AEA89C;font-weight:700;\">Check-out<\u002Fdiv>\n              <div style=\"font-size:14px;font-weight:700;color:#211E1A;margin-top:6px;\">{{selected.checkOutDate}}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#8A847A;margin-top:2px;\">{{selected.checkOutTime}}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"margin-top:16px;\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F4F0E9;\">\n              <span style=\"font-size:13px;color:#8A847A;\">Telefone<\u002Fspan>\n              <span style=\"font-size:13px;font-weight:600;color:#2A2620;\">{{selected.phone}}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #F4F0E9;\">\n              <span style=\"font-size:13px;color:#8A847A;\">Diária<\u002Fspan>\n              <span style=\"font-size:13px;font-weight:600;color:#2A2620;\">{{selected.nightlyLabel}}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex;justify-content:space-between;align-items:center;padding:14px 0 2px;\">\n              <span style=\"font-size:13px;color:#8A847A;\">Valor total<\u002Fspan>\n              <span style=\"font-family:'Marcellus',serif;font-size:21px;color:#211E1A;\">{{selected.valueLabel}}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;gap:10px;margin-top:18px;\">\n            <button onclick=\"{{callGuest}}\" style=\"flex:0 0 auto;padding:0 20px;height:47px;border-radius:14px;background:#fff;border:1.5px solid #E3DDD2;color:#3A352D;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;\">Ligar<\u002Fbutton>\n            <button onclick=\"{{viewReservation}}\" style=\"flex:1;height:47px;border-radius:14px;border:none;background:{{accent}};color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 5px 16px rgba(40,34,26,.18);\">Ver reserva<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- TOAST -->\n    <sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"position:absolute;left:50%;transform:translateX(-50%);bottom:86px;z-index:30;background:#211E1A;color:#fff;font-size:12px;font-weight:500;padding:11px 17px;border-radius:24px;box-shadow:0 7px 22px rgba(28,24,20,.3);white-space:nowrap;\">{{toast}}<\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:880},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2D5A4F&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2D5A4F&quot;,&quot;#3F5E8C&quot;,&quot;#8A5A3C&quot;,&quot;#4A4A55&quot;],&quot;section&quot;:&quot;Estilo&quot;},&quot;weekendShading&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Estilo&quot;},&quot;showStats&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Estilo&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const today = new Date(2026, 5, 26);\n    today.setHours(0, 0, 0, 0);\n    this.TODAY = today.getTime();\n    this.state = { weekStart: this.TODAY, view: 'timeline', selectedId: null, toast: null };\n    this.rooms = this.buildRooms();\n    this.MONTHS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];\n    this.WD = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];\n    this.WDL = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];\n    this.STATUS = {\n      confirmada: { label: 'Confirmada', bar: '#4E8A6B', bg: '#E4EFE8', text: '#2F6A4C' },\n      parcial:    { label: 'Parcial',    bar: '#C2933F', bg: '#F4EAD3', text: '#876721' },\n      pendente:   { label: 'Pendente',   bar: '#BC7559', bg: '#F3E2D9', text: '#94533A' },\n    };\n    this.NAMES = ['Emily Souza','Diego Martins','Ana Beatriz','Lucas Fernandes','Mariana Costa','Rafael Oliveira','Júlia Almeida','Pedro Henrique','Camila Rocha','Bruno Carvalho','Larissa Mendes','Gustavo Lima','Fernanda Dias','Thiago Barros','Beatriz Nunes','Rodrigo Pires','Carolina Reis','Felipe Gomes','Patrícia Ramos','André Luiz','Sofia Cardoso','Vinícius Melo','Helena Castro','Marcelo Tavares','Renata Lopes','Otávio Brandão'];\n  }\n\n  buildRooms() {\n    const defs = [\n      { prefix: 'Cabana ', from: 1, to: 4, type: 'Cabana', rate: 750 },\n      { prefix: 'Suíte ', from: 1, to: 3, type: 'Suíte Vista Mar', rate: 980 },\n      { prefix: 'Quarto ', from: 101, to: 108, type: 'Standard', rate: 420 },\n      { prefix: 'Superior ', from: 201, to: 205, type: 'Superior', rate: 560 },\n      { prefix: 'Família ', from: 301, to: 304, type: 'Família', rate: 690 },\n    ];\n    const out = [];\n    let id = 0;\n    defs.forEach(d => {\n      for (let n = d.from; n <= d.to; n++) {\n        out.push({ id: id++, name: d.prefix + n, type: d.type, rate: d.rate });\n      }\n    });\n    return out;\n  }\n\n  mulberry32(a) {\n    return function () {\n      a |= 0; a = (a + 0x6D2B79F5) | 0;\n      let t = Math.imul(a ^ (a >>> 15), 1 | a);\n      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n    };\n  }\n\n  addDays(ms, n) { return ms + n * 86400000; }\n\n  pad(n) { return n < 10 ? '0' + n : '' + n; }\n\n  buildReservations(weekStart) {\n    const dayKey = Math.floor(weekStart / 86400000);\n    const res = [];\n    let rid = 0;\n    this.rooms.forEach((room, idx) => {\n      const rng = this.mulberry32(dayKey * 1000003 + idx * 9176 + 17);\n      let day = [-2, -1, 0, 0, 1, 2][Math.floor(rng() * 6)];\n      let guard = 0;\n      while (day < 7 && guard < 5) {\n        guard++;\n        if (rng() < 0.42) { day += 1 + Math.floor(rng() * 3); continue; }\n        const nights = 1 + Math.floor(rng() * 5);\n        if (day + nights > 0) {\n          const r2 = rng();\n          const status = r2 < 0.6 ? 'confirmada' : (r2 < 0.85 ? 'parcial' : 'pendente');\n          const guest = this.NAMES[Math.floor(rng() * this.NAMES.length)];\n          const d1 = 1000 + Math.floor(rng() * 9000);\n          const d2 = 1000 + Math.floor(rng() * 9000);\n          const phone = '(48) 9' + d1 + '-' + d2;\n          res.push({\n            id: rid++, roomId: room.id, roomName: room.name, roomType: room.type,\n            guest, status, start: day, nights, nightly: room.rate, value: nights * room.rate,\n            phone, checkInMs: this.addDays(weekStart, day), checkOutMs: this.addDays(weekStart, day + nights),\n          });\n        }\n        day += nights + Math.floor(rng() * 2);\n      }\n    });\n    return res;\n  }\n\n  fmtDate(ms) { const d = new Date(ms); return d.getDate() + ' ' + this.MONTHS[d.getMonth()] + ' ' + d.getFullYear(); }\n  fmtDM(ms) { const d = new Date(ms); return d.getDate() + ' ' + this.MONTHS[d.getMonth()]; }\n  fmtBRL(n) { return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }\n  firstName(name) { return name.split(' ')[0]; }\n  initials(name) { const p = name.split(' '); return (p[0][0] + (p[1] ? p[1][0] : '')).toUpperCase(); }\n  nightsLabel(n) { return n + ' noite' + (n > 1 ? 's' : ''); }\n\n  showToast(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: null }), 2000);\n  }\n\n  openSheet(id) { this.setState({ selectedId: id }); }\n  closeSheet() { this.setState({ selectedId: null }); }\n\n  renderVals() {\n    const accent = this.props.accent ?? '#2D5A4F';\n    const weekendShading = this.props.weekendShading ?? true;\n    const showStats = this.props.showStats ?? true;\n    const ws = this.state.weekStart;\n    const view = this.state.view;\n    const res = this.buildReservations(ws);\n    const byId = {};\n    res.forEach(r => { byId[r.id] = r; });\n\n    // days\n    const days = [];\n    for (let i = 0; i < 7; i++) {\n      const ms = this.addDays(ws, i);\n      const d = new Date(ms);\n      const wd = d.getDay();\n      const isToday = ms === this.TODAY;\n      const isWeekend = wd === 0 || wd === 6;\n      days.push({\n        key: i, ms, weekdayShort: this.WD[wd], dayNum: d.getDate(), isToday,\n        weekdayColor: isToday ? accent : '#AEA89C',\n        numBg: isToday ? accent : 'transparent',\n        numColor: isToday ? '#FFFFFF' : '#6F6A61',\n        cellBg: isToday ? '#F2EEE7' : (isWeekend && weekendShading ? '#FAF8F4' : 'transparent'),\n      });\n    }\n\n    // timeline rows\n    const cell = 100 / 7;\n    const timelineRooms = this.rooms.map(room => {\n      const list = res.filter(r => r.roomId === room.id && r.start < 7 && (r.start + r.nights) > 0);\n      const bars = list.map(r => {\n        const rawLeft = r.start + 0.5;\n        const rawRight = r.start + r.nights + 0.5;\n        const startIn = rawLeft >= 0;\n        const endIn = rawRight <= 7;\n        const seam = 0.07;\n        const visLeft = Math.max(rawLeft, 0) + (startIn ? seam : 0);\n        const visRight = Math.min(rawRight, 7) - (endIn ? seam : 0);\n        let left = visLeft * cell;\n        let width = (visRight - visLeft) * cell;\n        if (width < 2) width = 2;\n        const rl = startIn ? 13 : 3;\n        const rr = endIn ? 13 : 3;\n        return {\n          id: r.id,\n          left: Math.round(left * 100) / 100,\n          width: Math.round(width * 100) / 100,\n          color: this.STATUS[r.status].bar,\n          radius: rl + 'px ' + rr + 'px ' + rr + 'px ' + rl + 'px',\n          label: r.nights >= 2 ? this.firstName(r.guest) : this.initials(r.guest),\n          open: () => this.openSheet(r.id),\n        };\n      });\n      const turnovers = [];\n      const seenT = {};\n      list.forEach(a => {\n        const cd = a.start + a.nights;\n        if (cd < 0 || cd > 6 || seenT[cd]) return;\n        if (list.some(b => b !== a && b.start === cd)) {\n          seenT[cd] = 1;\n          turnovers.push({ centerPct: Math.round(((cd + 0.5) / 7) * 10000) / 100 });\n        }\n      });\n      return {\n        id: room.id, name: room.name, type: room.type, bars, turnovers,\n        dotColor: list.length ? this.STATUS[list[0].status].bar : '#D2CCBE',\n      };\n    });\n\n    // stats\n    let bookedNights = 0;\n    res.forEach(r => { bookedNights += Math.max(0, Math.min(r.start + r.nights, 7) - Math.max(r.start, 0)); });\n    const occPct = Math.round(bookedNights / (this.rooms.length * 7) * 100) + '%';\n    const arrivalsCount = res.filter(r => r.start >= 0 && r.start < 7).length;\n    const departuresCount = res.filter(r => { const cd = r.start + r.nights; return cd >= 0 && cd <= 6; }).length;\n\n    // agenda\n    const mkCard = (r, kind) => ({\n      id: r.id, roomId: r.roomId, guest: r.guest, room: r.roomName,\n      kind, timeLabel: kind === 'Chegada' ? '14:00' : '12:00',\n      kindBg: kind === 'Chegada' ? '#E7F0EA' : '#F1E7E0',\n      kindColor: kind === 'Chegada' ? '#34694F' : '#8A5B45',\n      statusLabel: this.STATUS[r.status].label,\n      statusBg: this.STATUS[r.status].bg,\n      statusColor: this.STATUS[r.status].text,\n      nightsLabel: this.nightsLabel(r.nights),\n      dateRange: this.fmtDM(r.checkInMs) + ' → ' + this.fmtDM(r.checkOutMs),\n      open: () => this.openSheet(r.id),\n    });\n    const agendaDays = days.map(day => {\n      const d = day.key;\n      const arrivals = res.filter(r => r.start === d).map(r => mkCard(r, 'Chegada'));\n      const departures = res.filter(r => (r.start + r.nights) === d).map(r => mkCard(r, 'Saída'));\n      const arrRooms = new Set(arrivals.map(c => c.roomId));\n      const depRooms = new Set(departures.map(c => c.roomId));\n      arrivals.forEach(c => { c.turnover = depRooms.has(c.roomId); });\n      departures.forEach(c => { c.turnover = arrRooms.has(c.roomId); });\n      const inHouse = res.filter(r => r.start <= d && (r.start + r.nights) > d).length;\n      const dt = new Date(day.ms);\n      return {\n        key: d, dayNum: day.dayNum, weekdayLong: this.WDL[dt.getDay()],\n        monthShort: this.MONTHS[dt.getMonth()] + '.', isToday: day.isToday,\n        occLabel: inHouse + ' de ' + this.rooms.length + ' ocupados',\n        arrivals, departures, empty: arrivals.length === 0 && departures.length === 0,\n      };\n    });\n\n    // selected\n    let selected = null;\n    if (this.state.selectedId != null && byId[this.state.selectedId]) {\n      const r = byId[this.state.selectedId];\n      selected = {\n        guest: r.guest, room: r.roomName, type: r.roomType,\n        statusLabel: this.STATUS[r.status].label,\n        statusBg: this.STATUS[r.status].bg,\n        statusColor: this.STATUS[r.status].text,\n        checkInDate: this.fmtDate(r.checkInMs), checkInTime: '14:00',\n        checkOutDate: this.fmtDate(r.checkOutMs), checkOutTime: '12:00',\n        nightsLabel: this.nightsLabel(r.nights),\n        nightlyLabel: this.fmtBRL(r.nightly) + ' /noite',\n        valueLabel: this.fmtBRL(r.value),\n        phone: r.phone,\n      };\n    }\n\n    const tActive = view === 'timeline';\n    const weekLabel = this.fmtDM(ws) + ' – ' + this.fmtDM(this.addDays(ws, 6));\n\n    return {\n      accent, showStats,\n      weekLabel,\n      isTimeline: tActive, isAgenda: !tActive,\n      timelineBg: tActive ? '#FFFFFF' : 'transparent',\n      timelineColor: tActive ? '#211E1A' : '#8A847A',\n      timelineShadow: tActive ? '0 1px 3px rgba(40,34,26,.16)' : 'none',\n      agendaBg: !tActive ? '#FFFFFF' : 'transparent',\n      agendaColor: !tActive ? '#211E1A' : '#8A847A',\n      agendaShadow: !tActive ? '0 1px 3px rgba(40,34,26,.16)' : 'none',\n      days, timelineRooms, agendaDays,\n      occPct, arrivalsCount, departuresCount,\n      selected, toast: this.state.toast,\n      setTimeline: () => this.setState({ view: 'timeline' }),\n      setAgenda: () => this.setState({ view: 'agenda' }),\n      prevWeek: () => this.setState({ weekStart: this.addDays(ws, -7), selectedId: null }),\n      nextWeek: () => this.setState({ weekStart: this.addDays(ws, 7), selectedId: null }),\n      goToday: () => this.setState({ weekStart: this.TODAY, selectedId: null }),\n      closeSheet: () => this.closeSheet(),\n      stop: (e) => e.stopPropagation(),\n      newReservation: () => this.showToast('Nova reserva — em breve'),\n      viewReservation: () => this.showToast('Abrindo reserva completa…'),\n      callGuest: () => this.showToast('Ligando para o hóspede…'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
