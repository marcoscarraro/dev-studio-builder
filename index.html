          <span aria-hidden="true">&#8630;</span>

        <button type="button" class="tool-button btn btn-icon btn-outline-secondary" data-action="redo" title="Refazer" aria-label="Refazer">

    <main class="workspace">
      <aside class="palette-panel" aria-label="Componentes">
        <div class="panel-header">

        </div>

        <div class="palette-scroll">

          </div>

          <div id="palette-groups"></div>
        </div>
      </aside>

      <section class="canvas-panel" aria-label="Editor">
        <div class="canvas-toolbar">
          <div>
            <input id="page-name" class="page-name-input" type="text" placeholder="Nome da pagina" autocomplete="off" spellcheck="false">
            <span id="document-summary">0 componentes</span>
          </div>
          <button type="button" id="btn-page-settings" class="btn-page-settings" data-action="page-settings" title="Propriedades da pagina" aria-label="Propriedades da pagina">
            <img src="public/tabler/icons/outline/settings.svg" width="18" height="18" alt="" aria-hidden="true">
          </button>
        </div>

        <div class="canvas-scroll">
          <div id="editor-page-navbar" class="editor-page-navbar"></div>
          <div id="editor-page-body-wrapper" class="editor-page-body-wrapper">
            <div id="editor-page-sidebar" class="editor-page-sidebar"></div>
            <div class="editor-page-main">
              <div id="editor-page-header" class="editor-page-header page-header d-print-none"></div>
              <div id="canvas" class="canvas desktop" data-drop-zone="page" tabindex="0" aria-label="Area da pagina"></div>
              <div id="editor-page-footer" class="editor-page-footer page-footer d-print-none"></div>
            </div>
          </div>
        </div>
      </section>

      <aside class="properties-panel" aria-label="Propriedades">
        <div class="panel-header">
          <h1>Propriedades</h1>
        </div>
        <form id="properties-form" class="properties-form"></form>
      </aside>
    </main>
  </div>

  <dialog id="output-dialog" class="output-dialog">
    <form method="dialog" class="dialog-shell">
      <header>
        <strong id="output-title">Saida</strong>
        <button type="submit" aria-label="Fechar">&times;</button>
      </header>
      <textarea id="output-content" spellcheck="false"></textarea>
      <footer>
        <button type="button" class="tool-button text btn btn-outline-secondary" data-action="copy-output">Copiar</button>
        <button type="button" class="tool-button text btn btn-primary" data-action="download-output">Baixar</button>
      </footer>
    </form>
  </dialog>
